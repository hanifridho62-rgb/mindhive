name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Tests stub the heavy optional extras (chromadb / sentence-transformers),
      # so only the dev extra (pytest) is needed — keeps CI fast.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

  # The node tier-1 suite runs in its own job, not in the matrix above.
  #
  # It has to be a separate invocation because `addopts = -m 'not node'` in
  # pyproject.toml deselects it by default, and that default is load-bearing:
  # `hive selftest` shells `pytest -q tests/` from inside the dashboard's own
  # POST handler (verify.py), so an unfenced node suite would spawn node from
  # inside the web server. Deselected-by-default plus one explicit job is the
  # only shape that satisfies both.
  #
  # One job rather than four: these cases are pure JavaScript executed through
  # node:vm and have no OS or Python dimension, so running them on every matrix
  # leg would buy nothing. Without this job the 40 cases never execute in CI at
  # all — which is exactly what the CEO resequencing pulled T11 forward to
  # prevent, since T9's mandatory regression test would otherwise fall back to
  # the source-string style this project calls vacuous.
  node-tests:
    name: node tier-1 (paint guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # `-m node` overrides the deselect in pyproject.toml (-m is last-one-wins).
      # `--no-header -rA` so a failure names the case rather than only counting it.
      - name: Run node tier-1 tests
        run: python -m pytest -m node -q

  # The browser tier (T12), separate for the same deselect reason as the node
  # job, plus one of its own: it needs `pip install -e .[browser]` and a ~115 MB
  # Chromium that `.[dev]` deliberately does not pull, so folding it into the
  # matrix would put that download on every leg of a suite that never uses it.
  #
  # This tier answers what neither the Python nor the node suite can: whether a
  # CSS rule WINS. It earned its place before it was merged — the first mutant
  # run found that `header #live.stale:not(.paused)` was absent from the parsed
  # stylesheet entirely, killed by a comment that closed six lines early, while
  # every source-shape assertion about it passed.
  #
  # ubuntu only, one Python: these cases are about a rendering engine, and the
  # engine is the same one on every leg.
  browser-tests:
    name: browser tier (T12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,browser]

      # `--with-deps` installs the system libraries the headless browser needs;
      # the runner image ships none of them.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tier tests
        run: python -m pytest -m browser -q

  # The pg tier, deselected by default for the same reason as node and browser:
  # it needs a server, and a tier that errors on every fresh checkout is a tier
  # people learn to ignore. Without this job NOTHING about the Postgres read
  # mirror is verified on CI — not that the SQL compiles, not that the reader
  # role can read, not that 37k events round-trip to the same chain head, not
  # that a second statement cannot ride in on `query_database`. A green badge
  # said nothing about any of it, which is the exact shape of the MCP defect
  # this project already shipped: 37 passing tests around a `main()` that died
  # on startup, because the seam chosen so tests need no dependency does not
  # test the dependency.
  #
  # ubuntu only, and deliberately NOT folded into the OS/Python matrix: service
  # containers are a Linux-runner feature, so `windows-latest` cannot host one,
  # and the thing under test is SQL executed by a server whose behaviour has no
  # client-OS dimension.
  pg-tests:
    name: pg tier (Postgres 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17          # pinned, never `latest` — migrations are
        env:                        # digest-checked against this server's SQL
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindhive
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # `.[pg]` on top of `.[dev]`: the driver is an extra precisely so the
      # default tier keeps working without it, which is the state of a fresh
      # checkout and of every other job in this file.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,pg]

      - name: Apply migrations
        env:
          MINDHIVE_PG_DSN_ADMIN: postgresql://postgres:postgres@localhost:5432/mindhive
        run: python -m mindhive pg migrate

      # STEP ORDER IS LOAD-BEARING: this must follow `pg migrate`, because
      # `mindhive_reader` does not exist until 003 runs, and 003 creates it
      # LOGIN with no password on purpose ("The operator sets it out of band
      # ... so no secret is ever" committed). CI is one such operator.
      #
      # The password is GENERATED here and never written down: no repository
      # secret, no literal in the tree, so
      # `test_no_credential_literal_anywhere_in_src_or_tests` stays green with
      # no allowlist entry. `::add-mask::` keeps it out of the run log.
      - name: Give the reader role a password
        env:
          PGPASSWORD: postgres
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          psql -h localhost -U postgres -d mindhive \
            -c "ALTER ROLE mindhive_reader PASSWORD '$PW'"
          echo "MINDHIVE_PG_DSN_RO=postgresql://mindhive_reader:$PW@localhost:5432/mindhive" \
            >> "$GITHUB_ENV"

      # `-m pg` overrides the deselect in pyproject.toml (-m is last-one-wins),
      # exactly as the node and browser jobs above rely on.
      - name: Run pg tier tests
        env:
          MINDHIVE_PG_DSN_ADMIN: postgresql://postgres:postgres@localhost:5432/mindhive
        run: python -m pytest -m pg -q
