[project]
name = "mindhive"
version = "0.1.0"
description = "Deterministic event-sourced memory for long-running Claude sessions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vectors = ["chromadb>=0.5", "sentence-transformers>=2.2"]
dev = ["pytest>=8"]
app = ["pywebview>=5"]
build = ["pyinstaller>=6"]

[project.scripts]
hive = "mindhive.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
